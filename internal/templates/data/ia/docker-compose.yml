# LLM SSH Honeypot
# Generated by Otori CLI

services:
  honeypot:
    image: ghcr.io/otori-lab/otori-honeypots/honeypot-llm:latest
    container_name: otori-ia
    ports:
      - "2222:2222"
    environment:
      OLLAMA_URL: "http://ollama:11434/api/generate"
      OLLAMA_MODEL: "mistral:latest"
      FAKE_USER: "admin"
      FAKE_PASS: "admin123"
      FAKE_HOSTNAME: "honeypot"
      # EXTRA_CONTEXT: ""
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
